# Builds installers for Windows, macOS and Linux and attaches them to a draft
# GitHub release. Two variants per system:
#   standard: small; the AI model is downloaded once, on first use
#   offline:  the AI model (~600 MB) is bundled, for computers without internet
#
# Start it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0),
# or from the Actions tab (Run workflow).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        variant: [standard, offline]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          key: release

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libclang-dev patchelf

      - name: Bundled assets (OCR data, font)
        run: |
          node scripts/fetch-tessdata.mjs
          node scripts/fetch-fonts.mjs

      - name: AI model (offline variant)
        if: matrix.variant == 'offline'
        run: node scripts/fetch-model.mjs

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Signing switches on by itself once the secrets exist (see docs/SIGNING.md):
      #   TAURI_SIGNING_PRIVATE_KEY      update packages + latest.json (standard variant only;
      #                                  the offline edition updates by new installer)
      #   APPLE_CERTIFICATE, …           macOS signing and notarization
      - name: Signing setup
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=""
          if [ "${{ matrix.variant }}" = "offline" ]; then args="--config src-tauri/tauri.offline.conf.json"; fi
          if [ -n "$UPDATER_KEY" ] && [ "${{ matrix.variant }}" = "standard" ]; then
            args="$args --config src-tauri/tauri.updater.conf.json"
            { echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_EOF"; echo "$UPDATER_KEY"; echo "KEY_EOF"; } >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$UPDATER_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "UPDATER=true" >> "$GITHUB_ENV"
            echo "Update signing: on"
          else
            echo "Update signing: off"
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            { echo "APPLE_CERTIFICATE<<CERT_EOF"; echo "$APPLE_CERTIFICATE"; echo "CERT_EOF"; } >> "$GITHUB_ENV"
            for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "macOS signing: on"
          fi
          echo "TAURI_ARGS=$args" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: PaperKit ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            **Which file do I need?**
            - Windows 10/11: `…_windows_x64.exe` (or the `.msi`)
            - macOS (Apple Silicon): `…_darwin_aarch64.dmg`
            - Linux: `.AppImage`, `.deb` or `.rpm`
            - The `.app.tar.gz` files are for automatic updates later; you don't need them.

            Files ending in `_offline` include the AI model (~600 MB) for computers without internet access.
            The others download it once, the first time AI redaction is used.

            These builds are not code-signed yet: Windows may show a SmartScreen warning ("More info" → "Run anyway"),
            and on macOS right-click the app → Open the first time.
          releaseDraft: true
          args: ${{ env.TAURI_ARGS }}
          includeUpdaterJson: ${{ env.UPDATER == 'true' }}
          assetNamePattern: ${{ matrix.variant == 'offline' && '[name]_[version]_[platform]_[arch]_offline[ext]' || '[name]_[version]_[platform]_[arch][ext]' }}
